name: build-installers

# 多平台安装程序构建:推 tag(如 v1.0.0)时触发,也可手动触发。
# 产物上传到 Actions Artifacts;发版可配合 tauri-apps/tauri-action 上传到 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: ./scripts/package.sh macos --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      # audit-pipe 是 Tauri externalBin sidecar,构建应用前必须先产出对应三元组
      - run: cargo build -p famtool-cli --bin audit-pipe --release --target x86_64-pc-windows-msvc
      - run: |
          New-Item -ItemType Directory -Force crates/gui/binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/audit-pipe.exe crates/gui/binaries/audit-pipe-x86_64-pc-windows-msvc.exe
      # Windows 宿主可直接产出 NSIS 与 MSI(WiX)两种安装程序
      - run: npm run build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # audit-pipe 是 Tauri externalBin sidecar,构建应用前必须先产出对应三元组
      - run: cargo build -p famtool-cli --bin audit-pipe --release --target x86_64-unknown-linux-gnu
      - run: |
          mkdir -p crates/gui/binaries
          cp target/x86_64-unknown-linux-gnu/release/audit-pipe crates/gui/binaries/audit-pipe-x86_64-unknown-linux-gnu
          chmod 755 crates/gui/binaries/audit-pipe-x86_64-unknown-linux-gnu
      - run: npm run build -- --bundles deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
