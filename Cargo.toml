[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
dunce = "1"

[profile.release]
lto = true
strip = true
